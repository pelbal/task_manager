<form [formGroup]="form" (ngSubmit)="submit()">
	<label for="title">Cím</label>
	<input id="title" formControlName="title" required placeholder="Feladat címe" autofocus>
	<ng-container [ngTemplateOutlet]="fieldError"
		[ngTemplateOutletContext]="{ $implicit: form.controls.title, message: 'Add meg a feladat címét.' }" />
	<label for="description">Leírás</label>
	<textarea id="description" formControlName="description" rows="3" placeholder="További részletek"></textarea>
	<label for="task-status">Státusz</label>
	<select id="task-status" formControlName="status">
		@for (status of statuses; track status) {
		<option [value]="status">{{ status }}</option>
		}
	</select>
	<label for="due-date">Határidő</label>
	<p-datepicker inputId="due-date" formControlName="dueDate"
		dateFormat="yy. mm. dd." placeholder="ÉÉÉÉ. HH. NN." [showIcon]="true" [keepInvalid]="true"
		[firstDayOfWeek]="1" appendTo="body" panelStyleClass="deadline-calendar" />
	<ng-container [ngTemplateOutlet]="fieldError"
		[ngTemplateOutletContext]="{ $implicit: form.controls.dueDate, message: 'Add meg a dátumot ÉÉÉÉ. HH. NN. formátumban.' }" />
	@if (data.error()) {
		<p class="error">{{ data.error() }}</p>
	}
	<div class="actions">
		<button type="submit">
			{{ data.editing ? 'Módosítás mentése' : 'Feladat hozzáadása' }}
		</button>
		<button type="button" class="secondary" (click)="close()">Mégse</button>
	</div>
</form>

<ng-template #fieldError let-control let-message="message">
	@if (control.touched && control.invalid) {
		<p class="error">{{ message }}</p>
	}
</ng-template>
